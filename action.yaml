name: 'Generate CFN Parameters'
description: 'Parses a JSON config and outputs CloudFormation parameters, Stack name, and CI build identifier'

branding:
  icon: 'package'
  color: 'blue'
  logo: 'https://raw.githubusercontent.com/subhamay-bhattacharyya-gha/cfn-parameters-action/main/logo.png'

inputs:
  config-file:
    description: 'Path to the JSON config file'
    required: true
  environment:
    description: 'Target environment name (devl, test, prod)'
    required: true

outputs:
  parameters:
    description: 'Formatted CloudFormation parameters as multiline string'
  stack-name:
    description: 'Stack name for the given environment'
  ci-build-identifier:
    description: 'CI build identifier for the given environment'

runs:
  using: "node20"
  main: "main.js"